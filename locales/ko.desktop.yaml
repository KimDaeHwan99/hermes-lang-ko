"settings.fieldDescriptions.browser.useRealProfile": "로컬 탐색에서 실제 로그인 정보를 사용합니다. Hermes는 기본 브라우저의 프로필(쿠키, 로그인, 환경설정)을 관리되는 스냅샷으로 복사하고 내장 Chromium으로 실행합니다. 실제 프로필을 직접 열지 않으며, 실행할 때마다 복사본을 갱신합니다. 클라우드 브라우저 백엔드가 설정되어 있어도 에이전트가 요청에 따라 실제 프로필 기반 로컬 세션을 열 수 있습니다. Chromium 계열 브라우저(Chrome, Edge, Brave, Brave Origin, Chromium)만 지원하며, 다른 기본 브라우저는 명확한 오류 메시지와 함께 실패합니다. 기본값은 꺼짐입니다."
